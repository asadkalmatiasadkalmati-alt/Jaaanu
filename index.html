<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday, Sarah ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-primary: #d82b56;
    --pink-btn: linear-gradient(135deg, #f04670, #c41c46);
    --gold-btn: linear-gradient(135deg, #f5b942, #d98e14);
    --text-dark: #2d1820;
    --text-muted: #7a5663;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --script: 'Caveat', cursive;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--sans);
    color: var(--text-dark);
    /* Romantic Love Wallpaper Background */
    background-color: #ffe3ec;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255, 117, 151, 0.28) 0%, transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(255, 179, 198, 0.45) 0%, transparent 50%),
      radial-gradient(circle at 50% 85%, rgba(240, 70, 112, 0.22) 0%, transparent 55%),
      linear-gradient(160deg, #fff0f5 0%, #ffd6e4 50%, #ffc2d6 100%);
  }

  /* Floating Love Hearts Wallpaper Layer */
  .love-wallpaper {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .bg-heart {
    position: absolute;
    bottom: -40px;
    color: rgba(216, 43, 86, 0.22);
    animation: riseHeart linear infinite;
    user-select: none;
  }
  @keyframes riseHeart {
    0% { transform: translateY(0) rotate(0deg) scale(0.9); opacity: 0; }
    15% { opacity: 0.55; }
    85% { opacity: 0.45; }
    100% { transform: translateY(-110vh) rotate(25deg) scale(1.15); opacity: 0; }
  }

  /* Screen System */
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 22px 18px;
    text-align: center;
    z-index: 10;
  }
  .screen.active {
    display: flex;
    animation: fadeInScreen 0.55s ease forwards;
  }
  @keyframes fadeInScreen {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Typography */
  .eyebrow {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    color: #c9345a;
    margin-bottom: 6px;
  }
  .hero-title {
    font-family: var(--serif);
    font-size: 2.3rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--text-dark);
    margin-bottom: 10px;
  }
  .hero-title span {
    color: var(--pink-primary);
  }
  .sub-copy {
    font-size: 0.92rem;
    color: var(--text-muted);
    max-width: 310px;
    line-height: 1.5;
    margin: 0 auto 22px;
  }

  /* Touch-Safe Buttons */
  .pill-btn {
    background: var(--pink-btn);
    color: #fff;
    border: none;
    padding: 15px 32px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(196, 28, 70, 0.35), inset 0 1px 1px rgba(255,255,255,0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    z-index: 50;
    touch-action: manipulation;
  }
  .pill-btn:active {
    transform: scale(0.95);
  }
  .pill-btn.gold {
    background: var(--gold-btn);
    box-shadow: 0 10px 26px rgba(217, 142, 20, 0.4);
  }

  /* ================= SCREEN 1: LOVE ENVELOPE ================= */
  .envelope-stage {
    position: relative;
    width: 300px;
    height: 215px;
    margin: 24px auto 30px;
    cursor: pointer;
    z-index: 30;
    touch-action: manipulation;
  }
  .env-back {
    position: absolute;
    bottom: 0;
    left: 20px;
    width: 260px;
    height: 165px;
    background: #f2b8c6;
    border-radius: 14px;
    box-shadow: 0 18px 36px rgba(168, 42, 76, 0.2);
    z-index: 1;
  }
  .env-card {
    position: absolute;
    bottom: 14px;
    left: 36px;
    width: 228px;
    height: 145px;
    background: #fffafb;
    border-radius: 12px;
    padding: 16px 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    border: 1px solid #f7cdd8;
    z-index: 2;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .env-card-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .env-card-dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #f08ca4;
  }
  .env-card-for {
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.92rem;
    color: #9e6b7b;
  }
  .env-card-name {
    font-family: var(--serif);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--pink-primary);
    margin-top: 2px;
  }
  .envelope-stage.opened .env-card {
    transform: translateY(-76px);
  }
  .env-front {
    position: absolute;
    bottom: 0;
    left: 20px;
    width: 260px;
    height: 165px;
    background: linear-gradient(180deg, #ffe5ec 0%, #ffc2d4 100%);
    border-radius: 14px;
    z-index: 4;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .env-front::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(32deg, rgba(235, 145, 170, 0.32) 49%, transparent 50%),
      linear-gradient(-32deg, rgba(235, 145, 170, 0.32) 49%, transparent 50%);
  }
  .env-flap {
    position: absolute;
    top: 50px;
    left: 20px;
    width: 0;
    height: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-top: 96px solid #ffd1df;
    transform-origin: top;
    transition: transform 0.6s ease;
    z-index: 5;
  }
  .envelope-stage.opened .env-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .env-decor {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .heart-seal {
    width: 46px;
    height: 46px;
    background: radial-gradient(circle at 35% 30%, #ff7597, #d82b56);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.3rem;
    box-shadow: 0 6px 14px rgba(216, 43, 86, 0.4);
    border: 2px solid #fff0f5;
  }
  .peek-teddy {
    position: absolute;
    bottom: 8px;
    left: -10px;
    width: 80px;
    height: 90px;
    z-index: 6;
    opacity: 0;
    transform: translateX(20px) scale(0.7);
    transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
  }
  .peek-bunny {
    position: absolute;
    bottom: 10px;
    right: -6px;
    width: 70px;
    height: 82px;
    z-index: 6;
    opacity: 0;
    transform: translateX(-20px) scale(0.7);
    transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
  }
  .envelope-stage.opened .peek-teddy,
  .envelope-stage.opened .peek-bunny {
    opacity: 1;
    transform: translateX(0) scale(1);
  }

  /* ================= SCREEN 2: DARK ROMANTIC NIGHT ================= */
  #screen-2 {
    background: radial-gradient(circle at 50% 45%, #2b1829 0%, #140b16 100%);
    color: #fff;
  }
  #screen-2.lights-on {
    background: radial-gradient(circle at 50% 35%, #fff5e6 0%, #ffd6e4 100%);
  }
  .tiny-star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffd6e4;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 2.2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.8); }
    to { opacity: 0.9; transform: scale(1.3); }
  }
  .dark-teddy {
    position: absolute;
    bottom: 24px;
    left: 20px;
    width: 85px;
    opacity: 0.38;
  }

  /* ================= SCREEN 3: PARTY ROOM ================= */
  #screen-3 {
    justify-content: space-between;
    padding-top: 0;
    padding-bottom: 18px;
  }
  .bunting-bar {
    width: 100%;
    max-width: 440px;
    height: 55px;
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding: 0 8px;
    border-top: 2px solid #e09fb2;
  }
  .flag {
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 26px solid #f04670;
    transform-origin: top;
    animation: swayFlag 2.4s ease-in-out infinite alternate;
  }
  .flag:nth-child(2n) { border-top-color: #ff9ebb; animation-delay: 0.3s; }
  .flag:nth-child(3n) { border-top-color: #ffd166; animation-delay: 0.6s; }
  @keyframes swayFlag {
    from { transform: rotate(-4deg); }
    to { transform: rotate(4deg); }
  }
  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.9);
    border: 1px solid #f5b8c9;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #b8254b;
    box-shadow: 0 4px 12px rgba(216,43,86,0.1);
    margin: 6px 0 18px;
  }
  .party-bottom-scene {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 175px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .yay-note {
    position: absolute;
    top: 0;
    left: 18px;
    font-family: var(--serif);
    font-style: italic;
    color: #c9345a;
    font-size: 0.98rem;
    transform: rotate(-6deg);
  }
  .balloon-cluster {
    position: absolute;
    left: 10px;
    bottom: 18px;
    width: 125px;
    height: 145px;
  }
  .gift-boxes {
    position: absolute;
    right: 12px;
    bottom: 16px;
    width: 115px;
    height: 100px;
  }

  /* ================= SCREEN 4: CAKE CUTTING ================= */
  .cake-stage {
    position: relative;
    width: 270px;
    height: 245px;
    margin: 10px auto 20px;
    cursor: pointer;
    z-index: 30;
    touch-action: manipulation;
  }
  .cake-half {
    position: absolute;
    inset: 0;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cake-left { clip-path: inset(0 50% 0 0); }
  .cake-right { clip-path: inset(0 0 0 50%); }
  .cake-stage.sliced .cake-left { transform: translateX(-18px) rotate(-1.5deg); }
  .cake-stage.sliced .cake-right { transform: translateX(18px) rotate(1.5deg); }
  .rainbow-core {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 34px;
    height: 132px;
    background: linear-gradient(180deg, #ff758f 0%, #ffb347 25%, #ffe066 50%, #8ce99a 75%, #b197fc 100%);
    border-radius: 4px;
    transition: transform 0.65s ease 0.1s;
    z-index: 1;
  }
  .cake-stage.sliced .rainbow-core { transform: translateX(-50%) scaleX(1); }
  .swipe-guide {
    position: absolute;
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    height: 162px;
    width: 2px;
    border-left: 2px dashed rgba(216, 43, 86, 0.6);
    z-index: 8;
    pointer-events: none;
  }
  .swipe-dot {
    position: absolute;
    top: -6px;
    left: -8px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f04670;
    border: 2px solid #fff;
    animation: swipeDownHint 1.5s ease-in-out infinite;
  }
  @keyframes swipeDownHint {
    0% { top: -6px; opacity: 1; }
    85% { top: 145px; opacity: 0.8; }
    100% { top: 155px; opacity: 0; }
  }
  .cake-stage.sliced .swipe-guide { opacity: 0; }

  /* ================= SCREEN 5: MAKE A WISH ================= */
  .wish-hero {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    position: relative;
  }

  /* ================= SCREEN 6: POLAROIDS ================= */
  .polaroid-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 340px;
    margin: 4px auto 22px;
  }
  .polaroid-card {
    background: #fff;
    padding: 9px 9px 14px;
    border-radius: 8px;
    box-shadow: 0 10px 22px rgba(168, 42, 76, 0.14);
    transform: rotate(var(--rot, -2deg));
  }
  .polaroid-card:nth-child(1) { --rot: -3deg; }
  .polaroid-card:nth-child(2) { --rot: 2.5deg; }
  .polaroid-card:nth-child(3) { --rot: 2deg; }
  .polaroid-card:nth-child(4) { --rot: -2.5deg; }
  .polaroid-art {
    width: 100%;
    aspect-ratio: 1 / 0.92;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .polaroid-caption {
    font-family: var(--script);
    font-size: 1.2rem;
    color: #5c3240;
    margin-top: 7px;
  }

  /* ================= SCREEN 7: LOVE LETTER ================= */
  .notebook-card {
    background:
      repeating-linear-gradient(180deg, transparent 0px, transparent 27px, #f7d7e0 28px),
      #fffafb;
    width: 100%;
    max-width: 375px;
    max-height: 72vh;
    overflow-y: auto;
    padding: 24px 22px 26px;
    border-radius: 16px;
    box-shadow: 0 16px 38px rgba(168, 42, 76, 0.16);
    border: 1px solid #f7cdd8;
    text-align: left;
    margin-bottom: 18px;
  }
  .letter-salutation {
    font-family: var(--serif);
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 12px;
  }
  .letter-salutation span { color: var(--pink-primary); }
  .letter-body p {
    font-size: 0.9rem;
    line-height: 28px;
    color: #452832;
    margin-bottom: 14px;
  }
  .drop-cap {
    float: left;
    font-family: var(--serif);
    font-size: 2.5rem;
    line-height: 0.85;
    padding-right: 7px;
    padding-top: 4px;
    color: var(--pink-primary);
    font-weight: 700;
  }
  .letter-sign {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--pink-primary);
    text-align: right;
    margin-top: 6px;
  }

  /* ================= SCREEN 8: FINALE ================= */
  .finale-teddy {
    width: 145px;
    margin-bottom: 12px;
    animation: gentleFloat 3s ease-in-out infinite;
  }
  @keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .replay-link {
    margin-top: 20px;
    background: rgba(255,255,255,0.75);
    border: 1px solid #eb9fb5;
    color: #b8254b;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    z-index: 50;
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 99;
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<!-- Floating Love Hearts Wallpaper -->
<div class="love-wallpaper">
  <span class="bg-heart" style="left:8%; font-size:18px; animation-duration:9s;">❤️</span>
  <span class="bg-heart" style="left:22%; font-size:24px; animation-duration:12s; animation-delay:2s;">💕</span>
  <span class="bg-heart" style="left:38%; font-size:16px; animation-duration:10s; animation-delay:4s;">💖</span>
  <span class="bg-heart" style="left:55%; font-size:22px; animation-duration:11s; animation-delay:1s;">💗</span>
  <span class="bg-heart" style="left:72%; font-size:19px; animation-duration:9.5s; animation-delay:3s;">❤️</span>
  <span class="bg-heart" style="left:88%; font-size:25px; animation-duration:13s; animation-delay:5s;">💞</span>
</div>

<!-- ==================== SCREEN 1: ENVELOPE ==================== -->
<section id="screen-1" class="screen active">
  <p class="eyebrow">a little something with love ♥</p>
  <h1 class="hero-title">There's<br>something <span>for you</span></h1>
  <p class="sub-copy">A tiny birthday surprise, made with all my heart for you.</p>

  <div class="envelope-stage" id="envelopeStage" onclick="openEnvAction()">
    <div class="env-back"></div>
    <div class="env-card">
      <div class="env-card-dots"><i></i><i></i><i></i><i></i><i></i></div>
      <span class="env-card-for">for my love</span>
      <span class="env-card-name">Sarah</span>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-decor">
      <div style="font-size:1.35rem; margin-bottom:-6px;">🌹</div>
      <div class="heart-seal">🤍</div>
    </div>

    <!-- Cute Teddy Bear SVG -->
    <svg class="peek-teddy" viewBox="0 0 100 110">
      <circle cx="28" cy="30" r="13" fill="#d48c46"/>
      <circle cx="28" cy="30" r="7" fill="#f2be85"/>
      <circle cx="72" cy="30" r="13" fill="#d48c46"/>
      <circle cx="72" cy="30" r="7" fill="#f2be85"/>
      <polygon points="50,4 37,24 63,24" fill="#f04670"/>
      <circle cx="50" cy="4" r="4" fill="#ffd166"/>
      <circle cx="50" cy="44" r="24" fill="#e09850"/>
      <ellipse cx="50" cy="50" rx="11" ry="8" fill="#fae0c3"/>
      <circle cx="42" cy="41" r="2.8" fill="#2c1e22"/>
      <circle cx="58" cy="41" r="2.8" fill="#2c1e22"/>
      <ellipse cx="50" cy="47" rx="3.5" ry="2.5" fill="#5c3624"/>
      <path d="M46 52 Q50 56 54 52" stroke="#5c3624" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="84" rx="22" ry="20" fill="#e09850"/>
      <ellipse cx="50" cy="84" rx="13" ry="12" fill="#fae0c3"/>
    </svg>

    <!-- Cute Bunny SVG -->
    <svg class="peek-bunny" viewBox="0 0 90 105">
      <ellipse cx="35" cy="22" rx="7" ry="19" transform="rotate(-10 35 22)" fill="#fff8f2" stroke="#ebd8cc" stroke-width="1.5"/>
      <ellipse cx="35" cy="22" rx="3.5" ry="13" transform="rotate(-10 35 22)" fill="#f7b8c6"/>
      <ellipse cx="57" cy="22" rx="7" ry="19" transform="rotate(12 57 22)" fill="#fff8f2" stroke="#ebd8cc" stroke-width="1.5"/>
      <ellipse cx="57" cy="22" rx="3.5" ry="13" transform="rotate(12 57 22)" fill="#f7b8c6"/>
      <circle cx="46" cy="50" r="21" fill="#fff8f2" stroke="#ebd8cc" stroke-width="1.5"/>
      <circle cx="39" cy="47" r="2.5" fill="#2c1e22"/>
      <circle cx="53" cy="47" r="2.5" fill="#2c1e22"/>
      <circle cx="34" cy="53" r="3.5" fill="#f7b8c6" opacity="0.7"/>
      <circle cx="58" cy="53" r="3.5" fill="#f7b8c6" opacity="0.7"/>
      <circle cx="46" cy="52" r="2.5" fill="#f04670"/>
      <ellipse cx="46" cy="82" rx="18" ry="16" fill="#fff8f2" stroke="#ebd8cc" stroke-width="1.5"/>
    </svg>
  </div>

  <button type="button" class="pill-btn" id="envBtn" onclick="btnEnvAction()">
    <span>❤️</span> <span id="envBtnText">Open your surprise ✨</span>
  </button>
</section>

<!-- ==================== SCREEN 2: DARK ROOM ==================== -->
<section id="screen-2" class="screen">
  <div class="tiny-star" style="top:15%; left:22%;"></div>
  <div class="tiny-star" style="top:28%; right:25%;"></div>
  <div class="tiny-star" style="top:65%; left:18%;"></div>
  <div class="tiny-star" style="bottom:22%; right:20%;"></div>

  <p class="eyebrow" style="color:#ff9ebb; font-size:1.25rem;">Shhh...</p>
  <h2 class="hero-title" style="color:#ffffff; font-size:2.2rem;">The room is<br>waiting for you.</h2>
  <p class="sub-copy" style="color:#e0b8c8;">Someone left the lights off on purpose.</p>

  <button type="button" class="pill-btn gold" onclick="turnOnLightsAction()">
    <span>Turn on the lights ✨</span>
  </button>

  <svg class="dark-teddy" viewBox="0 0 100 110">
    <circle cx="28" cy="30" r="13" fill="#d48c46"/>
